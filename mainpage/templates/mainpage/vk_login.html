<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Вход через VK ID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@vkid/sdk@2.6.1/dist-sdk/umd/index.js"></script>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 16px}
    #log{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;background:#f7f7f7;padding:12px;border-radius:8px;margin-top:12px}
  </style>
</head>
<body>
  <h1>Вход в VK</h1>
  <p>Сейчас откроется авторизация ВКонтакте…</p>
  <div id="log"></div>

  <script>
    const APP_ID = {{ VK_APP_ID|safe }};
    const REDIRECT = "{{ VK_REDIRECT_URL }}";

    const logEl = document.getElementById('log');
    const log = (...a) => { console.log(...a); logEl.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+"\n"; };

    const base64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const sha256 = async (t) => crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    const genRnd = (len=64) => base64url(crypto.getRandomValues(new Uint8Array(len)));

    async function preparePkceOnServer() {
      const code_verifier = genRnd(64);
      const code_challenge = base64url(await sha256(code_verifier));
      const state = genRnd(32);

      await fetch("/vkstart/vk-store-pkce/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ code_verifier, state }),
        credentials: "include"
      });

      return { code_challenge, state };
    }

    (async function init(){
      if (!window.VKIDSDK) { log("VKIDSDK не найден"); return; }
      const VKID = window.VKIDSDK;

      const { code_challenge, state } = await preparePkceOnServer();

      VKID.Config.init({
        app: APP_ID,
        redirectUrl: REDIRECT,
        state,
        scope: "wall",
        codeChallenge: code_challenge,
        responseMode: VKID.ConfigResponseMode.Redirect
      });

      VKID.Auth.login();
    })();
  </script>
</body>
</html>
