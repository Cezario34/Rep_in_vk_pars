<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Токен для отладки</title>
</head>
<body>
  <h1>Вставить VK-токен</h1>
  <p>Страница доступна только при DEBUG=True.</p>
  {% if error %}<p style="color:#b00">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p>
      <textarea name="token" rows="5" cols="80"
        placeholder="голый токен или URL с access_token="></textarea>
    </p>
    <button type="submit">Сохранить и открыть форму</button>
  </form>
</body>
</html>
